<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Compteur de Tricot</title>
    <!-- Balises pour simuler une application iOS native -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tricot App">

    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-color: #ffffff;
            --text-color: #1d1d1f;
            --accent-color: #0071e3;
            --secondary-text: #86868b;
            --active-step-bg: #e8f2fc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        .stats-card {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .stats-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .instructions-list {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 10px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f2f2f7;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .step:last-child {
            border-bottom: none;
        }

        .step.active {
            background-color: var(--active-step-bg);
            font-weight: 600;
        }

        .step-number {
            min-width: 25px;
            color: var(--secondary-text);
            font-size: 0.85rem;
        }

        .step.active .step-number {
            color: var(--accent-color);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            width: 100%;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.1s;
        }

        button:active {
            opacity: 0.7;
        }

        .btn-back {
            background-color: #e8e8ed;
            color: var(--text-color);
        }

        .btn-next {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-reset {
            background-color: transparent;
            color: #ff3b30;
            margin-top: 20px;
            font-size: 0.85rem;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>

        <div class="stats-card">
            <div class="stats-title" id="row-title">Chargement...</div>
            <div id="row-stats" style="color: var(--secondary-text);"></div>
        </div>

        <div class="instructions-list" id="instructions-container">
            <!-- Rempli dynamiquement -->
        </div>

        <div class="controls">
            <button class="btn-back" onclick="prevStep()">Retour</button>
            <button class="btn-next" onclick="nextStep()">Suivant</button>
        </div>

        <button class="btn-reset" onclick="resetApp()">Remettre à zéro</button>

            ["Row 9 ! Sl1wYO", "knit until 2nd marker", "SM", "M1L", "knit until 3rd marker (beginning/end of rnd)", "M1R", "Total: 182 (182, 186, 190, 194) 202, 210, 222 | Dos: 75 (75, 75, 77, 77) 81, 83, 89 | Devant: 75 (75, 75, 77, 77) 81, 83, 89 | Épaules: 16 (16, 18, 18, 20) 20, 22, 22"]
        ];
        // Indices d'état (Ligne actuelle, Étape actuelle)
        let currentRowIndex = 0;
        let currentStepIndex = 0;
        // Charger l'état sauvegardé au démarrage
        function loadProgress() {
            const savedRow = localStorage.getItem('knitting_row');
            const savedStep = localStorage.getItem('knitting_step');
            if (savedRow !== null && savedStep !== null) {
                currentRowIndex = parseInt(savedRow);
                currentStepIndex = parseInt(savedStep);
            }
        }
        // Sauvegarder l'état actuel
        function saveProgress() {
            localStorage.setItem('knitting_row', currentRowIndex);
            localStorage.setItem('knitting_step', currentStepIndex);
        }

        // Mettre à jour l'interface utilisateur
        function updateUI() {
            if (currentRowIndex >= rows.length) {
                document.getElementById('row-title').innerText = "🎉 Félicitations !";
                document.getElementById('row-stats').innerText = "Toutes les lignes ont été complétées.";
                document.getElementById('instructions-container').innerHTML = "Plus d'étapes à faire !";
                return;
            }
            const rowData = rows[currentRowIndex];
            const steps = rowData.slice(0, -1); // Toutes les étapes d'action
            const stats = rowData[rowData.length - 1]; // La chaîne finale des statistiques
            // Extraction du titre à partir de la première étape
            const titleMatch = steps[0].split(" ! ");
            const displayTitle = titleMatch.length > 1 ? titleMatch[0] : `Rang ${ currentRowIndex + 1}`;
        document.getElementById('row-title').innerText = displayTitle;
        document.getElementById('row-stats').innerText = stats;
        // Rendu graphique des étapes
        const container = document.getElementById('instructions-container');
        container.innerHTML = "";
        steps.forEach((stepText, index) => {
            let cleanText = stepText;
            // Nettoyer le tag "Row X !" de la première étape pour l'affichage épuré
            if (index === 0 && stepText.includes(" ! ")) {
                cleanText = stepText.split(" ! ")[1];
            }
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${ index === currentStepIndex ? 'active' : '' }`;
            stepDiv.innerHTML = <><div class="step-number">${index + 1}</div> <div class="step-text">${cleanText}</div></>;
            container.appendChild(stepDiv);
        });
        }

        function nextStep() {
            const stepsCount = rows[currentRowIndex].length - 1;
            currentStepIndex++;
            if (currentStepIndex >= stepsCount) {
                currentStepIndex = 0;
                currentRowIndex++;
            }
            saveProgress();
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
            } else if (currentRowIndex > 0) {
                currentRowIndex--;
                currentStepIndex = rows[currentRowIndex].length - 2;
            }
            saveProgress();
            updateUI();
        }

        function resetApp() {
            if (confirm("Voulez-vous vraiment reprendre au tout début (Rang 1) ?")) {
                currentRowIndex = 0;
                currentStepIndex = 0;
                saveProgress();
                updateUI();
            }
        }
        // Initialisation
        loadProgress();
        updateUI();
    </script>
</body>

</html>
